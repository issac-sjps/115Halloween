<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萬聖節密室逃脫</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { -webkit-touch-callout: none; height: 100%; overflow: hidden; margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background: #0d0d14; color: #f0e6d2; }
  
  /* 背景影片 */
  #bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    z-index: -1;
    object-fit: cover;
    filter: brightness(0.6);
  }

  .hidden { display: none !important; }

  /* 教室大螢幕佈局 */
  #room-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 4vw;
    position: relative;
    z-index: 1;
  }

  .back-btn, .reset-btn {
    position: absolute; top: 1.5vh; background: #1c1c28cc; border: 1px solid #4a3d5c;
    color: #f0e6d2; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
    z-index: 5;
  }
  .back-btn { left: 12px; }
  .reset-btn { right: 12px; }
  .back-btn:hover, .reset-btn:hover { border-color: #ff8c2b; color: #ff8c2b; }

  #story-box {
    max-width: 720px; text-align: center;
    font-size: clamp(16px, 2.6vh, 24px); line-height: 1.6; max-height: 34vh;
    text-shadow: 2px 2px 4px #000;
  }

  #countdown-hint {
    text-align: center; font-size: clamp(14px, 2.2vh, 18px); color: #ffcc4d;
    margin: 1vh 0; min-height: 2.4vh; text-shadow: 1px 1px 3px #000;
  }

  #color-clue {
    text-align: center; margin: 0.4vh 0 1.4vh; font-size: clamp(14px, 2.2vh, 20px); font-weight: bold;
    padding: 0.8vh 20px; border-radius: 10px; display: inline-block;
  }
  .clue-red { background: #4a1010cc; color: #ff6b6b; border: 2px solid #ff6b6b; }
  .clue-yellow { background: #4a3d10cc; color: #ffe066; border: 2px solid #ffe066; }

  #timer {
    font-size: clamp(28px, 6.5vh, 56px); font-weight: bold; text-align: center; margin: 0.5vh 0;
    letter-spacing: 2px; text-shadow: 0 0 14px currentColor;
  }
  .t-safe { color: #7ee787; }
  .t-warn { color: #ffcc4d; }
  .t-danger { color: #ff5c5c; animation: pulse 0.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  #keypad-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 1vh; }
  #pw-display {
    font-size: clamp(22px, 3.8vh, 34px); letter-spacing: 10px; min-height: 5vh; margin-bottom: 1.4vh;
    border-bottom: 2px solid #ff8c2b; padding: 4px 20px; min-width: 220px; text-align: center;
    background: rgba(0,0,0,0.5); border-radius: 6px;
  }
  #keypad {
    display: grid; grid-template-columns: repeat(3, clamp(52px, 8vh, 70px)); gap: 10px;
  }
  #keypad button {
    height: clamp(44px, 7.5vh, 60px); font-size: clamp(16px, 2.8vh, 22px); border-radius: 10px;
    border: 1px solid #4a3d5c; background: #241b30dd; color: #f0e6d2; cursor: pointer;
  }
  #keypad button:hover { border-color: #ff8c2b; }
  #keypad button:active { background: #382b48; }
  .key-clear { color: #ffcc4d !important; }
  .key-enter { color: #7ee787 !important; }

  #feedback {
    margin-top: 1.2vh; font-size: clamp(14px, 2.2vh, 20px); font-weight: bold;
    min-height: 2.8vh; text-align: center; text-shadow: 1px 1px 3px #000;
  }
  .fb-wrong { color: #ff5c5c; }
  .fb-right { color: #7ee787; }

  #end-screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-size: clamp(20px, 3.6vh, 30px); background: rgba(13, 13, 20, 0.92); z-index: 10;
  }
  #end-screen.success { color: #7ee787; }
  #end-screen.fail { color: #ff5c5c; }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
</style>
</head>
<body>

<!-- 背景動態影片 -->
<video id="bg-video" autoplay loop muted playsinline preload="auto">
  <source src="https://issac-sjps.github.io/115Halloween/witch-bg.mp4" type="video/mp4">
</video>

<!-- 教室大螢幕內容 -->
<div id="room-screen">
  <button id="fullscreen-btn" class="back-btn" onclick="enterFullscreen()">🖥️ 全螢幕</button>
  <button id="reset-btn" class="reset-btn" onclick="resetRoom()">🔄 重置（請只按一次）</button>

  <div id="story-box"></div>
  <div id="countdown-hint"></div>

  <div id="challenge-area" class="hidden">
    <div id="timer" class="t-safe">05:00</div>
    <div id="color-clue-wrap"><span id="color-clue"></span></div>
    <div id="keypad-wrap">
      <div id="pw-display"></div>
      <div id="keypad"></div>
    </div>
    <div id="feedback"></div>
  </div>

  <div id="end-screen" class="hidden"></div>
</div>

<script>
/* ================= 教室設定區 ================= */
const ROOM = {
    title: "萬聖節密室逃脫",
    timeLimit: 300, // 倒數時間 (秒)
    password: "1031", // 密碼（可改為您的關卡密碼）
    bgmUrl: "https://issac-sjps.github.io/115Halloween/bgm.mp3",
    winBgmUrl: "https://issac-sjps.github.io/115Halloween/HappyEnding.mp3",
    storyText: "🎃 歡迎來到女巫的魔法教室！門已經被封印了，請在時間結束前解開 4 位數密碼逃脫！",
    clueText: "🔴 提示：萬聖節是哪一天？（月/日 4 位數）",
    clueClass: "clue-red"
};

let timerInterval = null;
let timeLeft = ROOM.timeLimit;
let currentInput = "";
let isGameEnded = false;
let audioUnlocked = false;

/* 音效控制 */
const bgm = new Audio(ROOM.bgmUrl);
bgm.loop = true;
const winAudio = new Audio(ROOM.winBgmUrl);

function unlockAudio() {
  if (!audioUnlocked) {
    bgm.play().then(() => {
      audioUnlocked = true;
    }).catch(e => console.log("等待使用者互動播放音樂:", e));
  }
}

document.addEventListener("click", unlockAudio, { once: true });

/* 打字機效果 */
function typeStory(text, elementId, speed = 40, callback) {
  const el = document.getElementById(elementId);
  el.innerHTML = "";
  let i = 0;
  const timer = setInterval(() => {
    if (i < text.length) {
      el.innerHTML += text.charAt(i);
      i++;
    } else {
      clearInterval(timer);
      if (callback) callback();
    }
  }, speed);
}

/* 初始化遊戲 */
function initGame() {
  typeStory(ROOM.storyText, "story-box", 40, () => {
    document.getElementById("countdown-hint").innerText = "⏰ 倒數計時開始！請點擊數字鍵輸入密碼：";
    document.getElementById("challenge-area").classList.remove("hidden");
    startTimer();
  });

  const clueEl = document.getElementById("color-clue");
  clueEl.innerText = ROOM.clueText;
  clueEl.className = ROOM.clueClass;

  renderKeypad();
}

/* 渲染鍵盤 */
function renderKeypad() {
  const keypad = document.getElementById("keypad");
  keypad.innerHTML = "";
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "↵"];
  
  keys.forEach(k => {
    const btn = document.createElement("button");
    btn.innerText = k;
    if (k === "C") {
      btn.className = "key-clear";
      btn.onclick = () => clearInput();
    } else if (k === "↵") {
      btn.className = "key-enter";
      btn.onclick = () => submitPassword();
    } else {
      btn.onclick = () => appendInput(k);
    }
    keypad.appendChild(btn);
  });
}

function appendInput(num) {
  unlockAudio();
  if (isGameEnded || currentInput.length >= 6) return;
  currentInput += num;
  updateDisplay();
}

function clearInput() {
  unlockAudio();
  if (isGameEnded) return;
  currentInput = "";
  updateDisplay();
  document.getElementById("feedback").innerText = "";
}

function updateDisplay() {
  document.getElementById("pw-display").innerText = currentInput;
}

function submitPassword() {
  unlockAudio();
  if (isGameEnded) return;
  
  const fb = document.getElementById("feedback");
  if (currentInput === ROOM.password) {
    gameWin();
  } else {
    fb.innerText = "❌ 密碼錯誤！請重新嘗試！";
    fb.className = "fb-wrong";
    const display = document.getElementById("pw-display");
    display.classList.add("shake");
    setTimeout(() => display.classList.remove("shake"), 400);
    currentInput = "";
    updateDisplay();
  }
}

function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      gameOver();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const s = (timeLeft % 60).toString().padStart(2, '0');
  const timerEl = document.getElementById("timer");
  timerEl.innerText = `${m}:${s}`;
  
  if (timeLeft <= 60) {
    timerEl.className = "t-danger";
  } else if (timeLeft <= 180) {
    timerEl.className = "t-warn";
  } else {
    timerEl.className = "t-safe";
  }
}

function gameWin() {
  isGameEnded = true;
  clearInterval(timerInterval);
  bgm.pause();
  winAudio.play().catch(e => console.log(e));

  const endScreen = document.getElementById("end-screen");
  endScreen.classList.remove("hidden");
  endScreen.className = "success";
  endScreen.innerHTML = `
    <div>🎉 恭喜成功過關！逃離女巫教室！🎃</div>
    <br>
    <button onclick="resetRoom()" style="padding:10px 24px; font-size:18px; cursor:pointer; background:#7ee787; border:none; border-radius:8px; font-weight:bold;">再玩一次</button>
  `;
}

function gameOver() {
  isGameEnded = true;
  bgm.pause();

  const endScreen = document.getElementById("end-screen");
  endScreen.classList.remove("hidden");
  endScreen.className = "fail";
  endScreen.innerHTML = `
    <div>💀 時間到！逃脫失敗，成為了女巫的晚餐... 👻</div>
    <br>
    <button onclick="resetRoom()" style="padding:10px 24px; font-size:18px; cursor:pointer; background:#ff5c5c; color:#fff; border:none; border-radius:8px; font-weight:bold;">重新挑戰</button>
  `;
}

function resetRoom() {
  location.reload();
}

function enterFullscreen() {
  unlockAudio();
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      alert(`無法切換全螢幕: ${err.message}`);
    });
  } else {
    document.exitFullscreen();
  }
}

window.onload = initGame;
</script>
</body>
</html>
