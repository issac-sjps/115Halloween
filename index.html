<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>萬聖節密室逃脫</title>
<style>
  :root {
    --story-zh-size: 20px;
    --story-en-size: 13px;
    --story-panel-width: 550px;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { -webkit-touch-callout: none; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #0d0d14;
    color: #f0e6d2;
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* ---------- 教室大螢幕：上下置中，用 vh/clamp 自動縮放不出現捲軸 ---------- */
  html, body { height: 100%; overflow: hidden; }
  #room-screen {
    height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 2vh 4vw; position: relative;
    background-size: cover; background-position: center;
  }
  .bg-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; pointer-events: none;
  }
  #room-screen > *:not(.bg-video) { z-index: 1; }
  #end-screen { z-index: 3; }

  #fullscreen-btn, #settings-btn {
    position: fixed; top: 1.5vh; background: #1c1c28cc; border: 1px solid #4a3d5c;
    color: #f0e6d2; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;
    z-index: 25;
  }
  #fullscreen-btn { left: 12px; }
  #settings-btn { right: 12px; }
  #fullscreen-btn small { font-size: 10px; opacity: 0.75; margin-left: 2px; }

  /* ---------- 設定浮動視窗 ---------- */
  #settings-panel {
    position: fixed; top: 6vh; right: 2vw; width: min(88vw, 320px);
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #17121ee6; border: 1px solid #4a3d5c; border-radius: 14px;
    padding: 2.4vh 4vw; z-index: 26; box-shadow: 0 10px 40px #000c;
  }
  #settings-panel h3 { margin: 0 0 1.6vh; font-size: 16px; color: #ff8c2b; }
  .settings-row { margin-bottom: 1.8vh; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row input[type="range"] { flex: 1; width: auto; }
  .slider-number {
    width: 58px; flex: 0 0 auto; text-align: center;
    background: #241b30; border: 1px solid #4a3d5c; border-radius: 8px;
    color: #f0e6d2; font-size: 13px; padding: 4px 2px;
  }
  .slider-number::-webkit-inner-spin-button,
  .slider-number::-webkit-outer-spin-button { opacity: 1; }
  .settings-row label { display: block; font-size: 13px; margin-bottom: 0.6vh; color: #d8cbb6; }
  #volume-slider { width: 100%; }
  #volume-value { font-size: 12px; color: #b8afa0; }
  .settings-btn-full {
    width: 100%; padding: 8px 0; margin-top: 0.6vh; font-size: 13px;
    border-radius: 8px; border: 1px solid #4a3d5c; background: #241b30;
    color: #f0e6d2; cursor: pointer;
  }
  #reset-request-btn { border-color: #ff8c2b; color: #ff8c2b; }
  #reset-confirm-row p { font-size: 12px; color: #ffcc4d; margin: 1vh 0 0.8vh; text-align: center; }
  #reset-confirm-row { display: flex; flex-direction: column; gap: 6px; }
  #confirm-reset-btn { border-color: #ff5c5c; color: #ff5c5c; }
  #settings-close-btn { margin-top: 1.4vh; opacity: 0.75; }

  /* ---------- 說明浮動視窗 ---------- */
  #story-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(94vw, var(--story-panel-width)); max-height: 80vh; overflow-y: auto;
    background: #100c16f5; border: 1px solid #4a3d5c; border-radius: 14px;
    padding: 3vh min(4vw, 26px); z-index: 40; box-shadow: 0 10px 50px #000e;
  }
  #site-title-img {
    position: fixed; top: 3%; left: 50%; transform: translateX(-50%);
    width: min(92vw, 720px); max-width: 92vw; height: auto;
    z-index: 5; pointer-events: none;
    filter: drop-shadow(0 4px 14px #000c);
  }
  #story-box {
    text-align: center;
    line-height: 1.7;
  }
  .story-zh { font-size: var(--story-zh-size); }
  .story-en { font-size: var(--story-en-size); }
  #story-cursor { animation: blink 0.8s infinite; font-size: var(--story-zh-size); }
  @keyframes blink { 50% { opacity: 0; } }

  #story-confirm-btn {
    display: block; margin: 2.2vh auto 0; padding: 10px 28px;
    font-size: clamp(14px, 2vh, 17px); background: #ff8c2b; color: #1c1c28;
    border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  #story-confirm-btn.ready { opacity: 1; pointer-events: auto; }
  #story-confirm-btn.waiting { opacity: 0.5; pointer-events: none; }
  #story-confirm-btn:active { transform: scale(0.96); }

  #story-mini-btn {
    position: fixed; bottom: 2.5vh; right: 2vw; z-index: 12;
    background: #1c1c28dd; border: 1px solid #4a3d5c; color: #f0e6d2;
    border-radius: 50px; padding: 10px 18px; font-size: 14px; cursor: pointer;
  }

  #countdown-hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; font-size: clamp(26px, 5.5vh, 48px); font-weight: 700;
    color: #ffcc4d; text-shadow: 0 0 16px #000, 0 0 4px #000;
    min-height: 2.4vh; z-index: 15; pointer-events: none;
    background: #17121e00; white-space: nowrap;
  }
  #countdown-hint:not(:empty) {
    background: #17121ecc; border: 1px solid #4a3d5c; border-radius: 14px;
    padding: 1.6vh 4vw; box-shadow: 0 10px 40px #000c;
  }

  #color-clue {
    text-align: center; margin: 0.4vh 0 1.4vh; font-weight: bold;
    padding: 0.8vh 20px; border-radius: 10px; display: inline-block;
  }
  #color-clue .clue-en { font-size: clamp(16px, 2.6vh, 24px); margin-bottom: 0.3vh; }
  #color-clue .clue-zh { font-size: clamp(12px, 1.7vh, 15px); opacity: 0.8; }
  .clue-red { background: #4a1010; color: #ff6b6b; border: 2px solid #ff6b6b; }
  .clue-yellow { background: #4a3d10; color: #ffe066; border: 2px solid #ffe066; }
  .clue-blue { background: #10304a; color: #66c7ff; border: 2px solid #66c7ff; }
  .clue-green { background: #10402a; color: #6bffa0; border: 2px solid #6bffa0; }

  #timer {
    font-size: clamp(28px, 6.5vh, 56px); font-weight: bold; text-align: center; margin: 0.5vh 0;
    letter-spacing: 2px; text-shadow: 0 0 14px currentColor;
  }
  .t-safe { color: #7ee787; }
  .t-warn { color: #ffcc4d; }
  .t-danger { color: #ff5c5c; animation: pulse 0.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  #keypad-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 1vh; }
  #pw-display {
    font-size: clamp(20px, 3.5vh, 32px); letter-spacing: 10px; min-height: 4vh; margin-bottom: 1.4vh;
    border-bottom: 2px solid #4a3d5c; padding: 4px 20px; min-width: 200px; text-align: center;
  }
  #keypad {
    display: grid; grid-template-columns: repeat(3, clamp(48px, 7.5vh, 66px)); gap: 8px;
  }
  #keypad button {
    height: clamp(42px, 7.5vh, 58px); font-size: clamp(15px, 2.6vh, 20px); border-radius: 10px;
    border: 1px solid #4a3d5c; background: #241b30; color: #f0e6d2; cursor: pointer;
  }
  #keypad button:active { background: #382b48; }
  .key-clear { color: #ffcc4d !important; }
  .key-enter { color: #7ee787 !important; grid-column: span 1; }

  #feedback {
    margin-top: 1.2vh; font-size: clamp(13px, 2vh, 18px); font-weight: bold;
    min-height: 2.4vh; text-align: center;
  }
  .fb-wrong { color: #ff5c5c; }
  .fb-right { color: #7ee787; }

  #end-screen {
    position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 0 3vw 3vh 0; pointer-events: none;
  }
  #restart-btn {
    pointer-events: auto; padding: 10px 30px; font-size: clamp(15px, 2.2vh, 19px);
    background: #1c1c28dd; color: #f0e6d2; border: 1px solid #4a3d5c;
    border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 6px 24px #000a;
    opacity: 0; transform: translateY(12px); transition: opacity 0.4s, transform 0.4s;
  }
  #restart-btn.show { opacity: 1; transform: translateY(0); }
  #restart-btn:active { transform: scale(0.96); }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- SOS 提示藥水（左下角）---------- */
  #sos-wrap {
    position: fixed; left: 1.5vw; bottom: 2vh; z-index: 20;
    display: flex; flex-direction: column-reverse; gap: 10px;
    pointer-events: none;
  }
  .sos-btn {
    pointer-events: auto;
    width: clamp(69px, 10.5vh, 102px); height: clamp(69px, 10.5vh, 102px);
    padding: 0; border: 2px solid #ff8c2b; border-radius: 50%;
    background: #1c1c28dd; cursor: pointer; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.4); pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
    box-shadow: 0 0 0 rgba(255,140,43,0.6);
  }
  .sos-btn img { width: 78%; height: 78%; object-fit: contain; }
  .sos-btn.show { opacity: 1; transform: scale(1); pointer-events: auto; animation: sosPulse 1.6s infinite; }
  .sos-btn.opened { animation: none; box-shadow: 0 0 0 3px #ff8c2b55; }
  @keyframes sosPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,140,43,0.55); }
    50% { box-shadow: 0 0 0 10px rgba(255,140,43,0); }
  }

  #sos-card-overlay {
    position: fixed; inset: 0; z-index: 45;
    background: #000c;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  #sos-card-overlay.show { opacity: 1; pointer-events: auto; }
  #sos-card-overlay img {
    max-width: min(98vw, 1080px); max-height: 96vh;
    border-radius: 14px; box-shadow: 0 10px 50px #000e;
    border: 2px solid #ff8c2b;
  }
  #sos-card-close {
    position: fixed; z-index: 47; top: 2vh; right: 2vw;
    width: 40px; height: 40px; border-radius: 50%;
    background: #1c1c28ee; border: 2px solid #ff8c2b; color: #f0e6d2;
    font-size: 20px; line-height: 1; cursor: pointer;
    display: none; align-items: center; justify-content: center;
  }
  #sos-card-close.show { display: flex; }
  #sos-card-hint {
    position: fixed; bottom: 2vh; left: 50%; transform: translateX(-50%);
    z-index: 46; color: #f0e6d2; font-size: clamp(12px, 1.8vh, 15px);
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
    background: #1c1c28cc; padding: 6px 16px; border-radius: 20px;
  }
  #sos-card-hint.show { opacity: 1; }
</style>
</head>
<body>

<img id="site-title-img" src="Title.png" alt="女巫實驗室的秘密"
     onerror="this.onerror=null; this.src='https://issac-sjps.github.io/115Halloween/Title.png';">

<!-- ============ 教室大螢幕 ============ -->
<div id="room-screen">
  <video id="bg-video" class="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="https://issac-sjps.github.io/115Halloween/witch-bg.mp4" type="video/mp4">
  </video>
  <audio id="bgm" preload="auto" loop>
    <source src="https://issac-sjps.github.io/115Halloween/bgm.mp3" type="audio/mpeg">
  </audio>

  <button id="fullscreen-btn" onclick="enterFullscreen()">🖥️ 全螢幕 <small>(ESC離開)</small></button>
  <button id="settings-btn" onclick="toggleSettings()">⚙️ 設定</button>

  <div id="settings-panel" class="hidden">
    <h3>⚙️ 設定</h3>
    <div class="settings-row">
      <label>🔊 音量（<span id="volume-value">100%</span>）</label>
      <div class="slider-row">
        <input type="range" id="volume-slider" min="0" max="300" value="100" oninput="setVolume(this.value)">
        <input type="number" class="slider-number" id="volume-number" min="0" max="300" value="100" oninput="setVolume(this.value)">
      </div>
    </div>
    <div class="settings-row">
      <label>⏱️ 最後10秒倒數「搭搭搭」音量（<span id="tick-volume-value">500%</span>）</label>
      <div class="slider-row">
        <input type="range" id="tick-volume-slider" min="100" max="3000" step="10" value="500" oninput="setTickVolume(this.value)">
        <input type="number" class="slider-number" id="tick-volume-number" min="100" max="3000" step="10" value="500" oninput="setTickVolume(this.value)">
      </div>
    </div>
    <div class="settings-row">
      <label>🎬 結局影片預載狀態</label>
      <div id="ending-status-happy" style="font-size:12px; color:#d8cbb6;">🎉 過關動畫：⏳ 準備中…</div>
      <div id="ending-status-bad" style="font-size:12px; color:#d8cbb6; margin-top:4px;">💀 失敗動畫：⏳ 準備中…</div>
      <button class="settings-btn-full" style="margin-top:8px;" onclick="preloadAllEndings(true)">🔁 強制重新載入結局影片</button>
    </div>
    <div class="settings-row">
      <label>💾 本機下載（避免現場等待影片載入）</label>
      <p style="font-size:12px; color:#b8afa0; margin:0 0 8px; line-height:1.6;">
        如果現場網路不穩，建議上課前先下載整包遊戲到電腦，解壓縮後直接用瀏覽器打開資料夾裡的 <code>index.html</code>。
        影片、音效都在本機讀取，不用等網路下載，就不會卡黑畫面。
      </p>
      <a href="https://github.com/issac-sjps/115Halloween/archive/refs/heads/main.zip"
         target="_blank" rel="noopener" class="settings-btn-full"
         style="display:block; text-align:center; text-decoration:none; box-sizing:border-box;">
         ⬇️ 下載完整遊戲檔案（ZIP）
      </a>
    </div>
    <div class="settings-row">
      <label>📜 說明視窗 — 中文字大小（<span id="story-zh-value">20px</span>）</label>
      <div class="slider-row">
        <input type="range" id="story-zh-slider" min="12" max="32" value="20" oninput="setStoryZhSize(this.value)">
        <input type="number" class="slider-number" id="story-zh-number" min="12" max="32" value="20" oninput="setStoryZhSize(this.value)">
      </div>
    </div>
    <div class="settings-row">
      <label>📜 說明視窗 — 英文字大小（<span id="story-en-value">13px</span>）</label>
      <div class="slider-row">
        <input type="range" id="story-en-slider" min="8" max="24" value="13" oninput="setStoryEnSize(this.value)">
        <input type="number" class="slider-number" id="story-en-number" min="8" max="24" value="13" oninput="setStoryEnSize(this.value)">
      </div>
    </div>
    <div class="settings-row">
      <label>📜 說明視窗 — 寬度上限（<span id="story-width-value">550px</span>）</label>
      <div class="slider-row">
        <input type="range" id="story-width-slider" min="300" max="900" value="550" oninput="setStoryPanelWidth(this.value)">
        <input type="number" class="slider-number" id="story-width-number" min="300" max="900" value="550" oninput="setStoryPanelWidth(this.value)">
      </div>
    </div>
    <button id="reset-request-btn" class="settings-btn-full" onclick="requestReset()">🔄 重置遊戲</button>
    <button class="settings-btn-full" style="border-color:#ff5c5c; color:#ff5c5c;" onclick="jumpToThirtySeconds()">⏩ 跳到倒數 30 秒（測試失敗結局用）</button>
    <div id="reset-confirm-row" class="hidden">
      <p>確定要重置嗎？目前進度將會清除。</p>
      <button id="confirm-reset-btn" class="settings-btn-full" onclick="confirmReset()">✅ 確認重置</button>
      <button class="settings-btn-full" onclick="cancelReset()">✖️ 取消</button>
    </div>
    <button id="settings-close-btn" class="settings-btn-full" onclick="toggleSettings()">關閉設定</button>
  </div>

  <div id="story-panel">
    <div id="story-box"></div>
    <button id="story-confirm-btn" onclick="storyButtonClick()">挑戰開始</button>
  </div>
  <button id="story-mini-btn" class="hidden" onclick="toggleStoryPanel()">📜 查看說明</button>

  <div id="countdown-hint"></div>

  <div id="challenge-area" class="hidden">
    <div id="timer" class="t-safe">05:00</div>
    <div id="color-clue-wrap" style="text-align:center;"><span id="color-clue"></span></div>
    <div id="keypad-wrap">
      <div id="pw-display"></div>
      <div id="keypad"></div>
    </div>
    <div id="feedback"></div>
  </div>

  <div id="end-screen" class="hidden"><button id="restart-btn" onclick="resetRoom()">🔄 重新開始</button></div>

  <!-- SOS 提示藥水（左下角） -->
  <div id="sos-wrap">
    <button class="sos-btn" id="sos-btn-1" onclick="toggleSosCard(1)"><img src="sos1.png" alt="SOS 1"></button>
    <button class="sos-btn" id="sos-btn-2" onclick="toggleSosCard(2)"><img src="sos2.png" alt="SOS 2"></button>
    <button class="sos-btn" id="sos-btn-3" onclick="toggleSosCard(3)"><img src="sos3.png" alt="SOS 3"></button>
  </div>
  <div id="sos-card-overlay" onclick="closeSosCard()">
    <img id="sos-card-img" src="" alt="提示卡片">
  </div>
  <button id="sos-card-close" onclick="closeSosCard()">✕</button>
  <div id="sos-card-hint">💡 點空白處、右上角 ✕，或再點一次藥水瓶，收起提示卡</div>
</div>

<script>
/* ================= 教室設定區（老師可自行修改）================= */
const ROOM = {
    story: "歡迎來到女巫的配藥室...\n架上擺滿了各色毒藥，每一瓶都散發著詭異的光。\n女巫留下一張古老的配方，藏著解開封印的密碼。\n5 分鐘內若不能找出正確的密碼，\n瓶中的毒氣將會瀰漫整間藥室...\n\nWelcome to the witch's potion room...\nThe shelves are filled with vials of poison, each glowing with an eerie light.\nThe witch left behind an ancient recipe, hiding the code that breaks the seal.\nIf you cannot find the correct code within 5 minutes,\nthe poisonous fumes will fill the entire room...",
    timeLimit: 300
};
/* 四色密碼對照表（四碼） */
const COLOR_CODES = {
  red:    { name: "紅色", code: "3621", cls: "clue-red" },
  yellow: { name: "黃色", code: "0932", cls: "clue-yellow" },
  blue:   { name: "藍色", code: "5267", cls: "clue-blue" },
  green:  { name: "綠色", code: "9453", cls: "clue-green" }
};
const BG_BASE = "https://issac-sjps.github.io/115Halloween/";
/* ================================================================ */

/* ================= 鎖定機制：禁右鍵 / 全螢幕 / 鍵盤白名單 ================= */
document.addEventListener("contextmenu", e => e.preventDefault());

function enterFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}

/* 只放行：0-9 數字、Enter(確認)、Backspace/Delete(清除)。
   Esc 不攔截，交由瀏覽器原生離開全螢幕。其餘按鍵一律阻擋。
   老師密技：按 Ctrl+C 可以解鎖鍵盤（恢復 F5、F12、Ctrl+R 等瀏覽器功能）。 */
let keyboardLocked = true;

document.addEventListener("keydown", e => {
  if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
    keyboardLocked = false;
    return; // 解鎖：不攔截，交還瀏覽器處理
  }
  if (!keyboardLocked) return; // 已解鎖，不再阻擋任何按鍵

  if (e.key === "Escape") return; // 讓瀏覽器處理離開全螢幕
  if (e.key >= "0" && e.key <= "9") {
    e.preventDefault();
    if (!document.getElementById("challenge-area").classList.contains("hidden")) {
      handleKey(e.key);
    }
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    if (!document.getElementById("challenge-area").classList.contains("hidden")) {
      handleKey("確認");
    }
    return;
  }
  if (e.key === "Backspace" || e.key === "Delete") {
    e.preventDefault();
    if (!document.getElementById("challenge-area").classList.contains("hidden")) {
      handleKey("清除");
    }
    return;
  }
  e.preventDefault(); // 阻擋 F5、Ctrl+R、Alt+Tab 快捷鍵觸發、其餘所有按鍵
}, true);
/* ================================================================ */


let currentColor = null;
let timeLeft = 0;
let timerInterval = null;
let countdownInterval = null;
let storyTimeoutId = null;
let pwInput = "";
let storyStage = "idle"; // idle -> typing -> done
let resetGuard = false;

/* ---------- SOS 提示藥水 ---------- */
const SOS_SCHEDULE = [30000, 60000, 90000]; // 30秒 / 1分鐘 / 1分30秒
let sosTimeouts = [];
let sosOpenIndex = null;

function scheduleSosPotions() {
  clearSosPotions();
  SOS_SCHEDULE.forEach((delay, idx) => {
    const n = idx + 1;
    sosTimeouts.push(setTimeout(() => {
      const btn = document.getElementById(`sos-btn-${n}`);
      if (btn) btn.classList.add("show");
    }, delay));
  });
}
function clearSosPotions() {
  sosTimeouts.forEach(t => clearTimeout(t));
  sosTimeouts = [];
  sosOpenIndex = null;
  for (let n = 1; n <= 3; n++) {
    const btn = document.getElementById(`sos-btn-${n}`);
    if (btn) { btn.classList.remove("show", "opened"); }
  }
  document.getElementById("sos-card-overlay").classList.remove("show");
  document.getElementById("sos-card-hint").classList.remove("show");
  document.getElementById("sos-card-close").classList.remove("show");
}
function toggleSosCard(n) {
  if (sosOpenIndex === n) {
    closeSosCard();
  } else {
    document.getElementById("sos-card-img").src = `card${n}.png`;
    document.getElementById("sos-card-overlay").classList.add("show");
    document.getElementById("sos-card-hint").classList.add("show");
    document.getElementById("sos-card-close").classList.add("show");
    document.getElementById(`sos-btn-${n}`).classList.add("opened");
    sosOpenIndex = n;
    beep(720, 0.12, "sine", 0.1);
  }
}
function closeSosCard() {
  document.getElementById("sos-card-overlay").classList.remove("show");
  document.getElementById("sos-card-hint").classList.remove("show");
  document.getElementById("sos-card-close").classList.remove("show");
  sosOpenIndex = null;
}

let audioCtx = null;
let bgmGainNode = null;
let masterVolume = 1.0; // 100%
const bgVideo = document.getElementById("bg-video");
const bgm = document.getElementById("bgm");
let backgroundAudioStarted = false;

bgm.volume = 1; // 實際音量交由 GainNode 控制

function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try {
      const src = audioCtx.createMediaElementSource(bgm);
      bgmGainNode = audioCtx.createGain();
      bgmGainNode.gain.value = 0.35 * masterVolume;
      src.connect(bgmGainNode).connect(audioCtx.destination);
    } catch (e) { /* 已連接過或不支援時忽略 */ }
  }
  return audioCtx;
}

function startBackgroundAudio() {
  getAudio();
  if (!backgroundAudioStarted) backgroundAudioStarted = true;
  bgm.play().catch(() => { backgroundAudioStarted = false; });
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}

function stopBackgroundAudio() {
  bgm.pause();
  bgm.currentTime = 0;
}

/* ---------- 結局影片預載（避免過關/失敗當下才開始下載，卡在黑畫面）---------- */
const ENDING_FILES = { happy: "happy_end.mp4", bad: "bad_end.mp4" };
const ENDING_LABELS = { happy: "🎉 過關動畫", bad: "💀 失敗動畫" };
const endingCache = {
  happy: { state: "idle", url: null },
  bad:   { state: "idle", url: null }
};

function updateEndingStatusUI() {
  ["happy", "bad"].forEach(key => {
    const el = document.getElementById(`ending-status-${key}`);
    if (!el) return;
    const label = ENDING_LABELS[key];
    const st = endingCache[key].state;
    let text;
    if (st === "ready") text = `${label}：✅ 已載入完成，隨時可播放`;
    else if (st === "loading") text = `${label}：⏳ 載入中…`;
    else if (st === "error") text = `${label}：❌ 載入失敗，請檢查網路後重試`;
    else text = `${label}：⏳ 準備中…`;
    el.textContent = text;
  });
}

function preloadEndingVideo(key, force) {
  const info = endingCache[key];
  if (!force && (info.state === "loading" || info.state === "ready")) return;
  if (force && info.url) { URL.revokeObjectURL(info.url); info.url = null; }
  info.state = "loading";
  updateEndingStatusUI();
  fetch(BG_BASE + ENDING_FILES[key])
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
    .then(blob => {
      info.url = URL.createObjectURL(blob);
      info.state = "ready";
      updateEndingStatusUI();
    })
    .catch(() => {
      info.state = "error";
      updateEndingStatusUI();
    });
}

function preloadAllEndings(force) {
  preloadEndingVideo("happy", force);
  preloadEndingVideo("bad", force);
}

/* ---------- 切換背景影片（一般 / 過關 / 失敗）---------- */
function switchBgVideo(file, loop) {
  bgVideo.loop = !!loop;
  bgVideo.muted = !!loop; // 一般背景影片靜音；過關/失敗影片播放聲音
  bgVideo.volume = Math.min(1, masterVolume);
  const titleImg = document.getElementById("site-title-img");
  if (titleImg) titleImg.style.display = loop ? "" : "none"; // 過關/失敗結局影片全螢幕播放時，暫時隱藏標題圖
  let src = BG_BASE + file;
  if (file === ENDING_FILES.happy && endingCache.happy.state === "ready") src = endingCache.happy.url;
  if (file === ENDING_FILES.bad && endingCache.bad.state === "ready") src = endingCache.bad.url;
  bgVideo.src = src;
  bgVideo.load();
  bgVideo.play().catch(() => {});
}

/* ---------- 音量控制（0%~300%，預設 100%）---------- */
let tickVolume = 5.0; // 500%，最後 10 秒倒數音效額外加成
function setVolume(v) {
  v = Math.max(0, Math.min(300, Math.round(v)));
  masterVolume = v / 100;
  document.getElementById("volume-value").textContent = v + "%";
  document.getElementById("volume-slider").value = v;
  document.getElementById("volume-number").value = v;
  if (bgmGainNode) bgmGainNode.gain.value = 0.35 * masterVolume;
  bgVideo.volume = Math.min(1, masterVolume);
}
function setTickVolume(v) {
  v = Math.max(100, Math.min(3000, Math.round(v)));
  tickVolume = v / 100;
  document.getElementById("tick-volume-value").textContent = v + "%";
  document.getElementById("tick-volume-slider").value = v;
  document.getElementById("tick-volume-number").value = v;
}

// 影片本身靜音自動播放；聲音音樂則於使用者第一次操作後播放。
document.addEventListener("pointerdown", startBackgroundAudio, { capture: true });
document.addEventListener("keydown", startBackgroundAudio, { capture: true });

function beep(freq, dur, type, vol) {
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.value = (vol || 0.15) * masterVolume;
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.stop(ctx.currentTime + dur);
}
function playWrong() { beep(180, 0.3, "sawtooth", 0.18); }
function playRight() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => setTimeout(() => beep(f, 0.25, "sine", 0.15), i * 130));
}
function playTick() { beep(880, 0.05, "sine", 0.06 * tickVolume); }

/* ---------- 設定浮動視窗 ---------- */
function toggleSettings() {
  document.getElementById("settings-panel").classList.toggle("hidden");
  document.getElementById("reset-confirm-row").classList.add("hidden");
  document.getElementById("reset-request-btn").classList.remove("hidden");
}
function requestReset() {
  document.getElementById("reset-request-btn").classList.add("hidden");
  document.getElementById("reset-confirm-row").classList.remove("hidden");
}
function cancelReset() {
  document.getElementById("reset-confirm-row").classList.add("hidden");
  document.getElementById("reset-request-btn").classList.remove("hidden");
}
function confirmReset() {
  if (resetGuard) return;
  resetGuard = true;
  toggleSettings();
  resetRoom();
  setTimeout(() => { resetGuard = false; }, 1500);
}

/* ---------- 測試用：跳到倒數 30 秒（方便老師預覽失敗結局） ---------- */
function jumpToThirtySeconds() {
  if (timerInterval && !document.getElementById("challenge-area").classList.contains("hidden")) {
    timeLeft = Math.min(timeLeft, 30);
    updateTimerDisplay();
    toggleSettings();
    beep(660, 0.12, "sine", 0.12);
  } else {
    alert("請先按下「挑戰開始」進入密碼倒數計時，再使用此測試按鈕。");
  }
}

/* ---------- 說明浮動視窗 ---------- */
function storyButtonClick() {
  if (storyStage === "idle") {
    startStoryTyping();
  } else if (storyStage === "typing") {
    return; // 播放中，忽略點擊
  } else {
    document.getElementById("story-panel").classList.add("hidden");
  }
}
function startStoryTyping() {
  storyStage = "typing";
  const btn = document.getElementById("story-confirm-btn");
  btn.classList.add("waiting");
  btn.textContent = "播放中…";
  typeStory(ROOM.story, () => {
    storyTimeoutId = setTimeout(() => {
      storyStage = "done";
      btn.textContent = "關閉";
      btn.classList.remove("waiting");
      document.getElementById("story-panel").classList.add("hidden");
      document.getElementById("story-mini-btn").classList.remove("hidden");
      beginCountdown();
    }, 1000);
  });
}
function toggleStoryPanel() {
  const panel = document.getElementById("story-panel");
  const opening = panel.classList.contains("hidden");
  panel.classList.toggle("hidden");
  if (opening) document.body.appendChild(panel); // 確保重新開啟時位於最上層
}

/* ---------- 初始化：直接進入女巫配藥室 ---------- */
preloadAllEndings();
resetRoom();

function resetRoom() {
  clearInterval(timerInterval);
  clearInterval(countdownInterval);
  clearTimeout(storyTimeoutId);
  timerInterval = null;
  countdownInterval = null;
  storyTimeoutId = null;
  clearSosPotions();

  switchBgVideo("witch-bg.mp4", true);
  bgVideo.onended = null;
  document.getElementById("restart-btn").classList.remove("show");

  timeLeft = ROOM.timeLimit;
  pwInput = "";
  storyStage = "idle";
  const colorKeys = Object.keys(COLOR_CODES);
  currentColor = colorKeys[Math.floor(Math.random() * colorKeys.length)];

  document.getElementById("countdown-hint").textContent = "";
  document.getElementById("challenge-area").classList.add("hidden");
  document.getElementById("end-screen").classList.add("hidden");
  document.getElementById("end-screen").className = "hidden";
  document.getElementById("feedback").textContent = "";

  document.getElementById("story-box").innerHTML = "";
  document.getElementById("story-confirm-btn").textContent = "挑戰開始";
  document.getElementById("story-confirm-btn").classList.add("ready");
  document.getElementById("story-confirm-btn").classList.remove("waiting");
  document.getElementById("story-mini-btn").classList.add("hidden");
  document.getElementById("story-panel").classList.remove("hidden");

  buildKeypad();
  startBackgroundAudio();
}

/* ---------- 說明視窗字級 / 寬度調整 ---------- */
function setStoryZhSize(v) {
  v = Math.max(12, Math.min(32, Math.round(v)));
  document.documentElement.style.setProperty("--story-zh-size", v + "px");
  document.getElementById("story-zh-value").textContent = v + "px";
  document.getElementById("story-zh-slider").value = v;
  document.getElementById("story-zh-number").value = v;
}
function setStoryEnSize(v) {
  v = Math.max(8, Math.min(24, Math.round(v)));
  document.documentElement.style.setProperty("--story-en-size", v + "px");
  document.getElementById("story-en-value").textContent = v + "px";
  document.getElementById("story-en-slider").value = v;
  document.getElementById("story-en-number").value = v;
}
function setStoryPanelWidth(v) {
  v = Math.max(300, Math.min(900, Math.round(v)));
  document.documentElement.style.setProperty("--story-panel-width", v + "px");
  document.getElementById("story-width-value").textContent = v + "px";
  document.getElementById("story-width-slider").value = v;
  document.getElementById("story-width-number").value = v;
}

/* ---------- 打字機效果，播完後執行 callback ---------- */
function typeStory(text, onDone) {
  const box = document.getElementById("story-box");
  box.innerHTML = "";
  let i = 0;
  const zhSpeed = 23; // 中文（及其他符號）逐字間隔
  const enSpeed = 12; // 英文逐字母間隔（約中文的 2 倍速）
  function classify(ch) { return /[a-zA-Z]/.test(ch) ? "story-en" : "story-zh"; }
  function renderShown(count) {
    let out = "";
    for (let j = 0; j < count; j++) {
      const ch = text[j];
      if (ch === "\n") { out += "<br>"; continue; }
      out += `<span class="${classify(ch)}">${ch}</span>`;
    }
    return out;
  }
  function step() {
    if (i <= text.length) {
      box.innerHTML = renderShown(i) + '<span id="story-cursor">▍</span>';
      const nextCh = text[i];
      const delay = nextCh && /[a-zA-Z]/.test(nextCh) ? enSpeed : zhSpeed;
      i++;
      storyTimeoutId = setTimeout(step, delay);
    } else {
      box.innerHTML = renderShown(text.length); // 移除閃爍游標
      if (onDone) onDone();
    }
  }
  step();
}

/* ---------- 確認後倒數 5 秒開始 ---------- */
function beginCountdown() {
  clearInterval(countdownInterval);
  const hint = document.getElementById("countdown-hint");
  let n = 5;
  hint.textContent = `挑戰即將開始… ${n}`;
  beep(660, 0.15, "sine", 0.12);
  countdownInterval = setInterval(() => {
    n--;
    if (n > 0) {
      hint.textContent = `挑戰即將開始… ${n}`;
      beep(660, 0.15, "sine", 0.12);
    } else {
      clearInterval(countdownInterval);
      countdownInterval = null;
      hint.textContent = "";
      beep(990, 0.2, "sine", 0.14);
      startChallenge();
    }
  }, 1000);
}

/* ---------- 開始挑戰 ---------- */
function startChallenge() {
  clearInterval(timerInterval);
  document.getElementById("challenge-area").classList.remove("hidden");
  const clue = document.getElementById("color-clue");
  const info = COLOR_CODES[currentColor];
  const enColor = currentColor.charAt(0).toUpperCase() + currentColor.slice(1);
  clue.innerHTML = `<div class="clue-en">The witch fears the "${enColor}" antidote the most!</div><div class="clue-zh">女巫最害怕「${currentColor}」的解藥！</div>`;
  clue.className = info.cls;
  updateTimerDisplay();
  scheduleSosPotions();
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 10 && timeLeft > 0) playTick();
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      showEnd(false);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.max(0, Math.floor(timeLeft / 60)).toString().padStart(2, "0");
  const s = Math.max(0, timeLeft % 60).toString().padStart(2, "0");
  const el = document.getElementById("timer");
  el.textContent = `${m}:${s}`;
  el.className = timeLeft <= 30 ? "t-danger" : (timeLeft <= 60 ? "t-warn" : "t-safe");
}

/* ---------- 數字鍵盤 ---------- */
function buildKeypad() {
  const pad = document.getElementById("keypad");
  pad.innerHTML = "";
  document.getElementById("pw-display").textContent = "";
  const keys = ["1","2","3","4","5","6","7","8","9","清除","0","確認"];
  keys.forEach(k => {
    const btn = document.createElement("button");
    btn.textContent = k;
    if (k === "清除") btn.classList.add("key-clear");
    if (k === "確認") btn.classList.add("key-enter");
    btn.onclick = () => handleKey(k);
    pad.appendChild(btn);
  });
}

function handleKey(k) {
  if (k === "清除") {
    pwInput = "";
  } else if (k === "確認") {
    checkPassword();
    return;
  } else {
    if (pwInput.length < 4) pwInput += k;
  }
  document.getElementById("pw-display").textContent = pwInput;
}

function checkPassword() {
  const fb = document.getElementById("feedback");
  if (pwInput === COLOR_CODES[currentColor].code) {
    fb.textContent = "";
    clearInterval(timerInterval);
    timerInterval = null;
    playRight();
    showEnd(true);
  } else {
    fb.textContent = "❌ 密碼錯誤，請再試一次";
    fb.className = "fb-wrong";
    playWrong();
    const wrap = document.getElementById("keypad-wrap");
    wrap.classList.add("shake");
    setTimeout(() => wrap.classList.remove("shake"), 400);
    pwInput = "";
    document.getElementById("pw-display").textContent = "";
  }
}

function showEnd(success) {
  clearSosPotions();
  document.getElementById("challenge-area").classList.add("hidden");
  document.getElementById("story-mini-btn").classList.add("hidden");
  const end = document.getElementById("end-screen");
  const restartBtn = document.getElementById("restart-btn");
  restartBtn.classList.remove("show");
  end.classList.remove("hidden");
  end.classList.toggle("fail", !success);
  stopBackgroundAudio();
  switchBgVideo(success ? "happy_end.mp4" : "bad_end.mp4", false);
  bgVideo.onended = () => { restartBtn.classList.add("show"); };
}
</script>
