<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 程式碼取代工具</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
}

textarea{
    width:100%;
    min-height:180px;
    margin:10px 0;
    padding:10px;
    font-family:Consolas,monospace;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    margin-right:10px;
    cursor:pointer;
}
</style>
</head>
<body>

<h2>HTML 程式碼取代工具</h2>

<label>原始 HTML</label>
<textarea id="source"></textarea>

<label>要修改的程式碼</label>
<textarea id="find"></textarea>

<label>取代成的程式碼</label>
<textarea id="replace"></textarea>

<button onclick="replaceCode()">開始取代</button>
<button onclick="copyResult()">複製結果</button>

<h3>修改後 HTML</h3>
<textarea id="result"></textarea>

<script>
function replaceCode() {
    const source = document.getElementById('source').value;
    const find = document.getElementById('find').value;
    const replace = document.getElementById('replace').value;

    if (!find) {
        alert('請輸入要修改的程式碼');
        return;
    }

    const result = source.split(find).join(replace);
    document.getElementById('result').value = result;
}

function copyResult() {
    const result = document.getElementById('result');
    result.select();
    navigator.clipboard.writeText(result.value);
    alert('已複製');
}
</script>

</body>
</html>
